# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wololo-seguridad-alimentaria
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 1 --threads 4 --timeout 120 --preload
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: GITHUB_REPO_URL
        value: https://github.com/JODACHSE/Mineria-de-Datos
      - key: VIDEO_ETAPA3_URL
        value: https://youtu.be/z8omdqE1M5I
